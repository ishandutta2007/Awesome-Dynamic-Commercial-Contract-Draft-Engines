<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#090d16"/></linearGradient><linearGradient id="primaryAccent" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366f1"/><stop offset="50%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient><linearGradient id="glowEffect" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#6366f1" stop-opacity=".3"/><stop offset="100%" stop-color="#6366f1" stop-opacity="0"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".65"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".75"/></linearGradient><filter id="shadow" width="120%" height="120%" x="-10%" y="-10%"><feDropShadow dx="0" dy="6" flood-color="#000" flood-opacity=".6" stdDeviation="10"/></filter><filter id="glowFilter" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><style>@keyframes floatSlow{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-8px) rotate(.5deg)}}@keyframes pulseBeam{0%{stroke-dashoffset:0;opacity:.35}50%{stroke-dashoffset:40;opacity:.85}}@keyframes glowOrb{0%{transform:scale(1);opacity:.25}50%{transform:scale(1.15);opacity:.45}}@keyframes shimmer{0%{transform:translateX(-100%)}}.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif;font-weight:800;font-size:38px;fill:#fff;letter-spacing:-.5px}.gradient-title{fill:url(#primaryAccent)}.badge-label,.pill-text,.subtitle-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.subtitle-text{font-size:16px;fill:#94a3b8;font-weight:400;letter-spacing:.2px}.pill-text{font-size:12px;font-weight:600;fill:#e2e8f0}.badge-label{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;fill:#38bdf8}.floating-card{animation:floatSlow 6s ease-in-out infinite}.floating-card-reverse{animation:floatSlow 7s ease-in-out infinite reverse}.data-stream{stroke-dasharray:8 12;animation:pulseBeam 4s linear infinite}.pulsing-orb{transform-origin:center;animation:glowOrb 8s ease-in-out infinite}</style></defs><rect width="1200" height="360" fill="url(#bgGrad)"/><circle cx="200" cy="80" r="180" fill="#6366f1" class="pulsing-orb" filter="url(#glowFilter)" opacity=".2"/><circle cx="1050" cy="280" r="220" fill="#06b6d4" class="pulsing-orb" filter="url(#glowFilter)" opacity=".18"/><circle cx="600" cy="180" r="250" fill="#8b5cf6" class="pulsing-orb" filter="url(#glowFilter)" opacity=".12"/><g opacity=".12"><path stroke="#94a3b8" stroke-width="1" d="M 0,60 L 1200,60 M 0,120 L 1200,120 M 0,180 L 1200,180 M 0,240 L 1200,240 M 0,300 L 1200,300"/><path stroke="#94a3b8" stroke-width="1" d="M 150,0 L 150,360 M 300,0 L 300,360 M 450,0 L 450,360 M 600,0 L 600,360 M 750,0 L 750,360 M 900,0 L 900,360 M 1050,0 L 1050,360"/></g><g opacity=".6"><path fill="none" stroke="#6366f1" stroke-width="2.5" d="M 80,310 C 240,240 380,340 520,290 S 800,240 1120,310" class="data-stream"/><path fill="none" stroke="#06b6d4" stroke-width="2" d="M 80,50 C 300,110 500,20 720,70 S 980,130 1120,50" class="data-stream"/></g><g class="floating-card-reverse" opacity=".85"><rect width="210" height="72" x="940" y="45" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)" rx="12"/><circle cx="965" cy="81" r="14" fill="#6366f1" opacity=".25"/><path fill="none" stroke="#818cf8" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M 960,81 L 964,85 L 971,77"/><text x="990" y="74" fill="#f8fafc" class="pill-text" font-size="12">Smart Clauses</text><text x="990" y="92" fill="#64748b" class="subtitle-text" font-size="11">Verified &amp; Guardrailed</text></g><g class="floating-card" opacity=".85"><rect width="240" height="76" x="910" y="235" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)" rx="12"/><circle cx="936" cy="273" r="14" fill="#06b6d4" opacity=".25"/><path fill="none" stroke="#38bdf8" stroke-linecap="round" stroke-width="2.2" d="M 930,273 L 942,273 M 936,267 L 936,279"/><text x="960" y="266" fill="#f8fafc" class="pill-text" font-size="12">AI Redline Engine</text><text x="960" y="284" fill="#64748b" class="subtitle-text" font-size="11">DOCX Tracked Changes</text></g><g transform="translate(60, 48)"><rect width="220" height="28" x="0" y="0" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity=".9" rx="14"/><circle cx="14" cy="14" r="5" fill="#38bdf8"/><text x="28" y="18" class="badge-label">ENTERPRISE LEGALTECH</text><text x="0" y="74" class="title-text">Dynamic Commercial Contract</text><text x="0" y="122" class="title-text gradient-title">Draft Engines &amp; CLM Ecosystem</text><text x="0" y="162" class="subtitle-text">Curated landscape of modular contract drafting engines, AI playbooks, clause libraries,</text><text x="0" y="186" class="subtitle-text">and open-source lifecycle automation tools for legal engineers and deal teams.</text><g transform="translate(0, 216)"><rect width="168" height="34" x="0" y="0" fill="#1e1e38" stroke="#6366f1" stroke-width="1.2" rx="8"/><text x="14" y="22" class="pill-text">⚡ Modular Clauses</text><rect width="176" height="34" x="180" y="0" fill="#132438" stroke="#0284c7" stroke-width="1.2" rx="8"/><text x="194" y="22" class="pill-text">🤖 AI Redline Agents</text><rect width="172" height="34" x="368" y="0" fill="#1e2530" stroke="#10b981" stroke-width="1.2" rx="8"/><text x="382" y="22" class="pill-text">🛡️ Open-Source CLM</text><rect width="160" height="34" x="552" y="0" fill="#2d1b3f" stroke="#a855f7" stroke-width="1.2" rx="8"/><text x="566" y="22" class="pill-text">📑 Smart Templates</text></g></g><rect width="1200" height="4" x="0" y="356" fill="url(#primaryAccent)"/></svg>